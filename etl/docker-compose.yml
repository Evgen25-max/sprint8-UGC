

# --- Общие настройки Kafka
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  # "консенсус в 2-е": acks=all + min.insync.replicas=2 при RF=3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 30s
  mem_limit: 600m
  networks: [default]
  restart: unless-stopped

services:

  # ==================== SPRINT 7: наблюдаемость ====================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-tracing
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - default
    restart: unless-stopped

  # ==================== SPRINT 7: Django + nginx ====================
  service:
    build: app
    expose:
      - "8000"
    env_file:
      - ./.env
    volumes:
      - static_data:/var/www/static
      - media_data:/var/www/media
    depends_on:
      theatre-db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      service:
        condition: service_started
      fastapi:
        condition: service_started
      auth-service:
        condition: service_started
      ugc-api:
        condition: service_started
    ports:
      - "80:80"
      - "8000:8000"
    restart: unless-stopped

  theatre-db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== SPRINT 7: поиск ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy

  etl:
    build: ./etl
    env_file:
      - ./.env
    volumes:
      - etl_logs:/opt/app/log
      - etl_state:/opt/app/state
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - elastic
    restart: unless-stopped

  fastapi:
    build: ./fastapi
    expose:
      - "8002"
    env_file:
      - ./.env
    volumes:
      - fastapi_logs:/opt/app/log
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - elastic
    restart: always

  # ==================== SPRINT 7: auth ====================
  auth-redis:
    image: redis:7.2-alpine
    command:
      - redis-server
      - --port
      - "6380"
      - --requirepass
      - ${REDIS_AUTH_PASSW}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_AUTH_PASSW}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
    restart: always

  auth-migrations:
    build: ./auth-service
    command: >
      sh -c "
        python wait-for-postgres.py &&
        echo 'Running Alembic migrations...' &&
        alembic upgrade head &&
        echo 'Migrations completed successfully!'
      "
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: theatre-db
      POSTGRES_PORT: 5432
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      POSTGRES_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}
      POSTGRES_CHECK_DB: postgres
    depends_on:
      theatre-db:
        condition: service_healthy
    networks:
      - default
    restart: "no"

  auth-service:
    build: ./auth-service
    expose:
      - "8001"
    env_file:
      - ./.env
    volumes:
      - auth_logs:/opt/app/logs
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --port ${REDIS_PORT}
      --requirepass ${REDIS_PASSW}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSW}", "ping"]
      interval: 6s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: always

  # ==================== SPRINT 8: Kafka-кластер (3 узла) ====================
  kafka-volume-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data/1 /data/2 /data/3"]
    volumes:
      - kafka_data_1:/data/1
      - kafka_data_2:/data/2
      - kafka_data_3:/data/3
    networks: [default]
    restart: "no"

  kafka-1:
    <<: *kafka-common
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully

  kafka-2:
    <<: *kafka-common
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully

  kafka-3:
    <<: *kafka-common
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully

  # Явное создание топиков: RF=3, min.insync.replicas=2, без автосоздания.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ugc.clicks --partitions 3 --replication-factor 3 --config min.insync.replicas=2 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ugc.page_views --partitions 3 --replication-factor 3 --config min.insync.replicas=2 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ugc.video_events --partitions 1 --replication-factor 3 --config min.insync.replicas=2 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ugc.search_events --partitions 1 --replication-factor 3 --config min.insync.replicas=2 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ugc.dlq --partitions 1 --replication-factor 3 --config min.insync.replicas=2 &&
       echo 'Topics ready'"
    networks: [default]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: ugc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "8085:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
    networks: [default]
    restart: unless-stopped

  # ==================== SPRINT 8: ClickHouse ====================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ugc}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ugc}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    networks: [default]
    restart: unless-stopped

  # SQL-миграции ClickHouse (аналог auth-migrations) — one-shot
  ugc-migrations:
    build: ./ugc-etl
    command: ["python", "migrate.py"]
    env_file:
      - ./.env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [default]
    restart: "no"

  # ==================== SPRINT 8: UGC API и ETL ====================
  ugc-api:
    build: ./ugc-api
    expose:
      - "8003"
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      REDIS_AUTH_HOST: auth-redis
      REDIS_AUTH_PORT: 6380
      RATELIMIT_REDIS_HOST: redis
      RATELIMIT_REDIS_PORT: ${REDIS_PORT:-6379}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ugc_api_logs:/opt/app/src/logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    networks: [default]
    restart: unless-stopped

  ugc-etl:
    build: ./ugc-etl
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      MEMORY_HARD_LIMIT_MB: ${UGC_MEMORY_HARD_LIMIT_MB:-384}
    ports:
      - "9101:9101"   # Prometheus-метрики: RSS, лаг, вставки, DLQ
    volumes:
      - ugc_etl_logs:/opt/app/src/logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      ugc-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    networks: [default]
    restart: unless-stopped

  clickhouse-ui:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [default]
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
  esdata:
  etl_logs:
  etl_state:
  redis_data:
  fastapi_logs:
  auth_logs:
  auth_redis_data:
  clickhouse_data:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  ugc_api_logs:
  ugc_etl_logs:
  grafana_data:

networks:
  default:
    driver: bridge
  elastic:
    driver: bridge
