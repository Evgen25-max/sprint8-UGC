server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    listen       8000 default_server;
    listen       [::]:8000 default_server;
    server_name  _;
    server_tokens off;
    client_max_body_size 100M;

    # === 1. СТАТИКА ===
    location /static/ {
        alias /var/www/static/;
        expires 10d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        location ~* \.(php|php[0-9]|phtml|pl|py|pyc|cgi|sh|bash|asp|aspx|exe|dll|jsp|rb|swf)$ {
            return 403;
        }
        location ~ /\. {
            return 404;
        }
        location ~* ^/media/(.+\.(svg|svgz|html|htm|xhtml|xml))$ {
            alias /var/www/media/$1;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            expires 7d;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # === 2. DJANGO ADMIN ===
    location /admin {
        include /etc/nginx/conf.d/uwsgi_backend.inc;
    }

    # === 3. AUTH-SERVICE ===
    # Документация auth
    location = /api/v1/auth/docs {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend/api/v1/auth/docs;
    }
    location = /api/v1/auth/redoc {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend/api/v1/auth/redoc;
    }
    location = /api/v1/auth/openapi.json {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend/api/v1/auth/openapi.json;
    }

    # Основные роуты auth-service
    location /api/v1/auth {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend;
    }
    location /api/v1/users {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend;
    }
    location /api/v1/roles {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend;
    }

    # Социальные сети (OAuth)
    location /api/v1/social {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://auth_backend;
    }

    # === 4. UGC COLLECTOR (sprint 8) ===
    # Health наружу: точное совпадение + подмена URI на /health
    location = /api/v1/ugc/health {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://ugc_backend/health;
    }

    # Все роуты коллектора: /events, /events/batch, /docs, /redoc, /openapi.json
    location /api/v1/ugc {
        client_max_body_size 1m;      #
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://ugc_backend;   # БЕЗ слэша в конце —
    }

    # === 5. DJANGO MOVIES (контент-сервис) ===
    location /api/v1/movies/ {
        include /etc/nginx/conf.d/uwsgi_backend.inc;
    }

    location ~ ^/api/v1/internal(/|$) {
        proxy_pass http://auth_backend;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # === 6. FASTAPI (films) ===
    # Общий /api ловит всё, что не перехвачено более длинными префиксами выше
    location /api {
        include /etc/nginx/conf.d/fastapi.inc;
        proxy_pass http://fastapi_backend;
    }

    # === 7. FALLBACK (Django/uwsgi для всего остального) ===
    location @backend {
        include /etc/nginx/conf.d/uwsgi_backend.inc;
    }
    location / {
        try_files $uri @backend;
    }

    # === 8. ERROR PAGES ===
    error_page 404              /404.html;
    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
