services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [ugc_test_net]

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ugc.clicks --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ugc.page_views --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ugc.video_events --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ugc.search_events --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ugc.dlq --partitions 1 --replication-factor 1 &&
       echo 'Topics ready'"
    networks: [ugc_test_net]
    restart: "no"

  # === ClickHouse ===
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ugc
      CLICKHOUSE_USER: ugc
      CLICKHOUSE_PASSWORD: ugc
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ugc_test_net]

  # === SQL-миграции ===
  ugc-migrations:
    build:
      context: ../../ugc-etl
    command: ["python", "migrate.py"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ugc
      CLICKHOUSE_PASSWORD: ugc
      CLICKHOUSE_DB: ugc
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [ugc_test_net]
    restart: "no"

  # === Auth Redis ===
  auth-redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --port 6380
      --requirepass test-auth-redis-pass
      --maxmemory 128mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "test-auth-redis-pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ugc_test_net]

  # === UGC API ===
  ugc-api:
    build:
      context: ../../ugc-api
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATE_LIMIT_REQUESTS: 100000
      RATE_LIMIT_PERIOD: 60
      JWT_SECRET_KEY: test-jwt-secret-key-for-ugc-tests
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      REDIS_AUTH_HOST: auth-redis
      REDIS_AUTH_PORT: 6380
      REDIS_AUTH_PASSW: test-auth-redis-pass
      REDIS_AUTH_DB: 1
      RATELIMIT_REDIS_HOST: auth-redis
      RATELIMIT_REDIS_PORT: 6380
      RATELIMIT_REDIS_PASSW: test-auth-redis-pass
      RATELIMIT_REDIS_DB: 2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [ugc_test_net]

  # === UGC ETL ===
  ugc-etl:
    build:
      context: ../../ugc-etl
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ugc
      CLICKHOUSE_PASSWORD: ugc
      CLICKHOUSE_DB: ugc
      MEMORY_HARD_LIMIT_MB: 512
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      ugc-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ugc_test_net]

  # === Тесты ===
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_URL: http://ugc-api:8003
      CH_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ugc               # <-- Исправлено (было CH_USER)
      CLICKHOUSE_PASSWORD: ugc           # <-- Исправлено (было CH_PASSWORD)
      JWT_SECRET_KEY: test-jwt-secret-key-for-ugc-tests
      PYTHONPATH: /tests/src
    depends_on:
      ugc-api:
        condition: service_healthy
      ugc-etl:
        condition: service_healthy
    networks: [ugc_test_net]
    entrypoint: >
      sh -c "
        echo 'Waiting for services to be fully ready...' &&
        sleep 5 &&
        echo 'Running pytest from src directory...' &&
        pytest src -v
      "

networks:
  ugc_test_net:
    driver: bridge